<style>
  :root {
    --paper: #FFFEFA;
    --grid: #EEF1F6;
    --desk: #ECE8E0;
    --ink: #2E3440;
    --muted: #4C566A;
    --line: #E2E6EE;
    --dash: #B9C0CC;
    --navy: #26335C;
    --navy-ink: #1F2640;
    --coral: #CC4E33;
    --coral-soft: #FFE3DB;
    --yellow: #FFD35C;
    --yellow-soft: #FFF1C9;
    --mint: #3E9C7D;
    --mint-ink: #1F5C48;
    --mint-soft: #DDF3EA;
    --sky: #2F72C4;
    --sky-soft: #E3EEFC;
    --warn: #7A4E00;
    --pink: #C2335B;
  }
  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body { margin: 0; font-family: 'Gowun Dodum', sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  a { color: var(--sky); }
  .jua { font-family: 'Jua', sans-serif; font-weight: 400; }

  .app {
    position: relative; max-width: 480px; margin: 0 auto; min-height: 100vh;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .app > * { position: relative; }
  .app.selecting { padding-bottom: 150px; }

  /* ---------- 홈 머리: 크레파스 피아노 + 곰 + 실로폰 ---------- */
  .keys { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 131; flex-shrink: 0; }
  .hero { position: relative; flex-shrink: 0; width: 100%; aspect-ratio: 3 / 1; background: url(header-art.png) center top / 100% auto no-repeat; }
  .hd { position: absolute; left: 0; right: 27%; top: 30%; padding: 0 0 0 14px; display: flex; align-items: center; gap: 6px; }
  .hd .char { width: clamp(56px, 18vw, 80px); height: clamp(56px, 18vw, 80px); object-fit: contain; flex-shrink: 0; }
  .hd .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hd .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .hd h1 { margin: 0; font-size: clamp(26px, 8.6vw, 38px); line-height: 1.1; white-space: nowrap; }

  .pickbtn { width: calc(100% - 40px); margin: 4px 20px 0; min-height: 52px; border-radius: 16px; border: none; background: var(--yellow); font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .ages { margin: 14px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-items: center; }
  .age { border-radius: 10px; border: 2px solid transparent; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 2px; word-break: keep-all; }
  .age .pegs { display: flex; gap: 22px; }
  .age .pegs i { width: 5px; height: 5px; border-radius: 3px; background: #fff; display: block; }
  .age.a0 { height: 62px; background: #FFD0C7; color: #5A1A0E; }
  .age.a1 { height: 56px; background: #FFE3A3; color: #4A3300; }
  .age.a2 { height: 50px; background: #CDEEDD; color: #154A33; }
  .age.a3 { height: 44px; background: #D6E7FA; color: #163F70; }
  .age.on { font-family: 'Jua', sans-serif; font-size: 14px; }
  .age.a0.on { background: #F28B7A; border-color: #A8382B; color: #3D0F08; }
  .age.a1.on { background: #FFC94D; border-color: #A87A00; color: #3A2800; }
  .age.a2.on { background: #8ED1AE; border-color: #2F7F5C; color: #0F3A27; }
  .age.a3.on { background: #7FB8E8; border-color: #2C5EA8; color: #0E2E55; }

  .homebar, .newbar, .notice { margin: 14px 20px 0; padding: 10px 8px 10px 14px; border-radius: 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .homebar { background: var(--sky-soft); color: #1F4677; }
  .newbar { background: var(--yellow-soft); color: var(--warn); }
  .notice { background: var(--yellow-soft); color: var(--warn); padding-right: 14px; line-height: 1.5; }
  .homebar .txt, .newbar .txt { flex: 1; font-weight: 700; }
  .homebar .txt { font-size: 13px; }
  .homebar .minibtn { padding: 0 4px; }
  .pill { font-size: 11px; font-weight: 700; color: #fff; background: var(--pink); border-radius: 10px; padding: 2px 8px; }
  .minibtn { border: none; background: none; font-size: 13px; min-height: 36px; padding: 0 8px; text-decoration: underline; color: inherit; }

  .views { margin: 14px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .view { min-height: 42px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 14px; color: var(--muted); }
  .view.on { border: 2px solid var(--ink); background: var(--ink); color: #fff; }

  .sec { padding: 18px 20px 0; }
  .sec h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .count { font-size: 13px; color: var(--muted); font-family: 'Gowun Dodum', sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 36px; padding: 0 12px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 13px; }
  .chip.on { border: 2px solid #C98A00; background: var(--yellow-soft); color: var(--warn); }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .abtn { min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .abtn.main { background: var(--navy); color: #fff; }
  .abtn.on { background: var(--yellow); border-color: var(--navy); color: var(--navy-ink); font-weight: 700; }

  /* ---------- 노래 줄 (시안 2) ---------- */
  .songs { display: flex; flex-direction: column; gap: 8px; }
  .song { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; border: 2px solid transparent; background: #fff; text-align: left; font-size: inherit; box-shadow: 0 1px 2px rgba(31,38,64,.1); }
  .song.picked { border-color: var(--navy); background: #FFFBEA; }
  .song.now { border-color: var(--yellow); }
  .thumbwrap { position: relative; flex-shrink: 0; width: 112px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; display: block; }
  .thumbwrap.c0 { background: #FFE2D9; } .thumbwrap.c1 { background: #DCEFE6; } .thumbwrap.c2 { background: #E1E8F8; } .thumbwrap.c3 { background: #FFF0C6; }
  .thumbph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); opacity: .35; }
  .thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb.fail { display: none; }
  .badge { position: absolute; left: 4px; top: 4px; font-size: 10px; font-weight: 700; color: #fff; background: #D9483A; border-radius: 6px; padding: 1px 6px; }
  .ytmark { position: absolute; right: 4px; bottom: 4px; font-size: 10px; color: #fff; background: rgba(31,38,64,.8); border-radius: 5px; padding: 1px 4px; }
  .sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .stitle { font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.3; word-break: keep-all; }
  .smeta { font-size: 12px; color: #4A5170; line-height: 1.4; }
  .sicon { flex-shrink: 0; width: 38px; height: 38px; border-radius: 19px; background: var(--yellow); display: flex; align-items: center; justify-content: center; color: var(--navy-ink); }
  .check { flex-shrink: 0; width: 30px; height: 30px; margin: 4px; border-radius: 9px; border: 2.5px solid var(--dash); background: #fff; display: flex; align-items: center; justify-content: center; color: #fff; }
  .song.picked .check { background: var(--navy); border-color: var(--navy); }
  .order { position: absolute; left: -4px; top: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .rmbtn { flex-shrink: 0; display: flex; align-items: center; min-height: 38px; padding: 0 10px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 12px; color: var(--muted); }

  .empty { padding: 18px 16px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; background: #fff; border-radius: 16px; border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty img { width: 92px; height: 92px; object-fit: contain; }
  .empty .minibtn { color: var(--sky); }

  /* ---------- 내 목록 ---------- */
  .lists { display: flex; flex-direction: column; gap: 10px; }
  .lcard { background: #fff; border-radius: 16px; border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .lcard .top { display: flex; align-items: center; gap: 10px; }
  .lcard .ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lcard .ic.c0 { background: #FFD0C7; } .lcard .ic.c1 { background: #FFE3A3; } .lcard .ic.c2 { background: #CDEEDD; } .lcard .ic.c3 { background: #D6E7FA; } .lcard .ic.c4 { background: #E6DBF7; }
  .lcard .name { flex: 1; min-width: 0; font-family: 'Jua', sans-serif; font-size: 18px; word-break: keep-all; }
  .lcard .n { font-family: 'Gowun Dodum', sans-serif; font-size: 13px; color: var(--muted); }
  .lcard .btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .newlist { width: 100%; min-height: 50px; border-radius: 16px; border: 2px dashed var(--dash); background: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tip { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ---------- 골라 듣기 아래 막대 ---------- */
  .selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; pointer-events: none; }
  .selbar .in { pointer-events: auto; width: 100%; max-width: 480px; background: var(--navy); color: #fff; border-radius: 22px 22px 0 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 16px rgba(31,38,64,.25); }
  .selbar .info { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
  .selbar .info b { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px; color: var(--yellow); }
  .selbar .info button { border: none; background: none; color: #C9D2EE; text-decoration: underline; font-size: 13px; min-height: 36px; }
  .selbar .btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .selbar .sb { min-height: 46px; border-radius: 14px; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .selbar .sb.go { background: var(--yellow); color: var(--navy-ink); font-family: 'Jua', sans-serif; font-size: 16px; }
  .selbar .sb:disabled { opacity: .4; }

  .shopcard { margin: 22px 20px 0; padding: 14px; border-radius: 16px; background: #fff; border: 2px solid var(--yellow); display: flex; flex-direction: column; gap: 10px; }
  .disc { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--yellow-soft); color: var(--warn); font-size: 12px; line-height: 1.5; }
  .shopbtn { min-height: 50px; border-radius: 14px; background: var(--yellow); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-family: 'Jua', sans-serif; font-size: 17px; }

  .ft { margin-top: auto; padding: 28px 20px 22px; font-size: 11px; line-height: 1.7; color: var(--muted); }
  .ft p { margin: 0 0 6px; }
  .ft .links { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .ft a { color: var(--muted); }

  /* ---------- 아래에서 올라오는 창 ---------- */
  .layer { position: fixed; inset: 0; z-index: 60; background: rgba(46,52,64,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 23px; text-align: center; }
  .sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); text-align: center; }
  .sheetchar { width: 110px; height: 110px; object-fit: contain; align-self: center; }
  .sheetbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sbtn { min-height: 50px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); }
  .sbtn.go { background: var(--yellow); border-color: var(--yellow); font-family: 'Jua', sans-serif; font-size: 17px; }
  .sbtn.danger { background: #FCE4DF; border-color: #F2B8AC; color: #8A2A18; }
  .sclose { border: none; background: none; color: var(--muted); font-size: 14px; min-height: 40px; }
  .pickrow { display: flex; flex-direction: column; gap: 8px; }
  .pickopt { width: 100%; min-height: 52px; border-radius: 14px; border: 2px solid var(--line); background: #fff; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; text-align: left; }
  .pickopt .nm { flex: 1; min-width: 0; font-family: 'Jua', sans-serif; font-size: 16px; }
  .pickopt .st { font-size: 12px; color: var(--muted); }
  .pickopt.in { border-color: var(--mint); background: var(--mint-soft); }
  .namebox { display: flex; gap: 8px; }
  .namebox label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .namebox input { flex: 1; min-width: 0; min-height: 50px; border-radius: 14px; border: 2px solid var(--dash); padding: 0 14px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); }
  .namebox input:focus { outline: none; border-color: var(--navy); }
  .namebox button { flex-shrink: 0; min-height: 50px; padding: 0 16px; border-radius: 14px; border: none; background: var(--navy); color: #fff; font-size: 15px; }
  .msg { min-height: 20px; text-align: center; font-size: 13px; color: #B3361F; }

  .quiz { font-family: 'Jua', sans-serif; font-size: 44px; text-align: center; }
  .answer { display: flex; justify-content: center; gap: 8px; }
  .answer span { width: 56px; height: 64px; border-radius: 14px; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 30px; }
  .answer.bad span { border-color: #D9483A; }
  .pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .key { min-height: 54px; border-radius: 14px; border: none; background: #F1EEE7; font-family: 'Jua', sans-serif; font-size: 24px; }
  .key.blank { visibility: hidden; }

  /* ---------- 노래 듣기 화면 ---------- */
  .ptop { padding: 12px 10px 0; display: flex; align-items: center; gap: 2px; }
  .iconbtn { width: 44px; height: 44px; flex-shrink: 0; border: none; background: none; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 12px; }
  .favbtn[aria-pressed="true"] { color: var(--pink); }
  .lockbtn { width: auto; padding: 0 10px; gap: 4px; font-size: 13px; background: var(--sky-soft); color: #1F4677; }
  .ptitle { flex: 1; margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px; line-height: 1.25; word-break: keep-all; }
  .pinfo { padding: 2px 20px 0 56px; font-size: 13px; color: var(--muted); }
  .playwrap { margin: 8px 16px 0; }
  .video { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #1C2230; border: 6px solid #fff; box-shadow: 0 1px 3px rgba(46,52,64,.15); }
  .video iframe, .video #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .err { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #E2E8F5; font-size: 14px; text-align: center; padding: 20px; line-height: 1.5; background: #1C2230; }
  .err a { color: var(--yellow); }
  .vsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .src { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .bigbtn { flex-shrink: 0; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 2px dashed var(--dash); background: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .bigctrls { display: none; }

  .qinfo { margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); }
  .qinfo b { color: var(--navy); }
  .ctrls { display: flex; justify-content: center; align-items: flex-start; gap: 18px; margin-top: 12px; }
  .cbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; font-size: 12px; padding: 0; min-width: 64px; }
  .cbtn .ic { width: 52px; height: 52px; border-radius: 26px; background: #fff; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .cbtn.main .ic { width: 72px; height: 72px; border-radius: 36px; background: var(--yellow); border: none; }
  .cbtn:disabled { opacity: .35; }
  .toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
  .tg { min-height: 46px; border-radius: 14px; border: 2px dashed var(--dash); background: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tg[aria-pressed="true"] { border: 2px solid var(--mint); background: var(--mint-soft); color: var(--mint-ink); font-weight: 700; }

  .items { margin-top: 10px; background: #fff; border-radius: 16px; padding: 12px 0 12px 12px; border: 2px solid var(--line); }
  .items .disc { margin: 0 12px 10px 0; }
  .ilist { display: flex; gap: 10px; overflow-x: auto; padding-right: 12px; scrollbar-width: none; }
  .ilist::-webkit-scrollbar { display: none; }
  .item { flex: 0 0 148px; display: flex; flex-direction: column; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--ink); background: #fff; }
  .item .iimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--paper); display: block; }
  .item .iimg.fail { visibility: hidden; }
  .item .ibody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .item .iname { font-size: 13px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .item .idesc { font-size: 11px; color: var(--muted); line-height: 1.4; word-break: keep-all; }

  /* ---------- 아이 모드 ---------- */
  .kidbar { display: none; }
  body.kid .nk { display: none !important; }
  body.kid .kidbar { display: flex; margin: 12px 16px 0; padding: 10px 10px 10px 12px; border-radius: 16px; background: var(--sky-soft); align-items: center; gap: 10px; }
  .kidbar img { width: 44px; height: 44px; object-fit: contain; }

/* =========================================================
   도우미
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function splitList(s) {
  return String(s || '').split(/[,，、\/]/).map(v => v.trim()).filter(Boolean);
}

function videoIdOf(url) {
  const s = String(url || '').trim();
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : '';
}

function safeLink(url) {
  const s = String(url || '').trim();
  return /^https:\/\//i.test(s) ? s : '';
}

function parseDate(s) {
  const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return '';
  return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

function tableOf(rows) {
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    header.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
    return o;
  });
}

function toSongs(rows) {
  const seen = new Set();
  return tableOf(rows).map(r => ({
    id: videoIdOf(r['유튜브 주소']),
    title: r['노래 이름'] || '',
    ages: splitList(r['나이']).filter(a => AGES.includes(a)),
    cats: splitList(r['주제']),
    length: r['길이'] || '',
    channel: r['채널명'] || '',
    added: parseDate(r['추가일'])
  })).filter(p => {
    if (!p.title || !p.id || seen.has(p.id)) return false;
    seen.add(p.id);
    if (!p.ages.length) p.ages = AGES.slice();
    return true;
  });
}

function toItems(rows) {
  return tableOf(rows).map(r => ({
    song: r['노래 이름'] || '',
    name: r['상품명'] || '',
    desc: r['한 줄 설명'] || '',
    img: safeLink(r['상품 이미지 주소']),
    link: safeLink(r['쿠팡 링크'])
  })).filter(it => it.song && it.name && it.link);
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function charImg(key, cls) {
  const c = CHARS[key] || CHARS.bear;
  return `<img class="${cls}" src="${c.src}" alt="${esc(c.name)} 친구">`;
}

function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  } catch (e) { return false; }
}

function deviceKind() {
  const ua = navigator.userAgent || '';
  if (/KAKAOTALK/i.test(ua)) return 'kakao';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'other';
}

function metaText(p) {
  return [p.cats.join(', '), p.length].filter(Boolean).join(' · ');
}

   저장 (이 폰의 브라우저에만 저장돼요)

function loadSaved() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return v && typeof v === 'object' ? v : {};
  } catch (e) { return {}; }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      age: state.age, cat: state.cat, view: state.view,
      lists: state.lists, seenNew: state.seenNew,
      kid: state.kid, queue: state.queue, repeatOne: state.repeatOne,
      homeTipClosed: state.homeTipClosed
    }));
  } catch (e) { /* 저장이 막힌 브라우저에서는 그냥 넘어가요 */ }
}

const saved = loadSaved();
function cleanLists(v) {
  if (!Array.isArray(v)) return [];
  return v.filter(l => l && typeof l.id === 'string' && typeof l.name === 'string' && Array.isArray(l.ids))
    .slice(0, CONFIG.MAX_LISTS)
    .map(l => ({ id: l.id, name: l.name.slice(0, CONFIG.LIST_NAME_MAX), ids: l.ids.filter(x => typeof x === 'string') }));
}
function cleanQueue(q) {
  if (!q || !Array.isArray(q.ids) || !Array.isArray(q.base) || !q.ids.length) return null;
  const idx = Number.isInteger(q.idx) && q.idx >= 0 && q.idx < q.ids.length ? q.idx : 0;
  return { ids: q.ids.filter(x => typeof x === 'string'), base: q.base.filter(x => typeof x === 'string'), idx, label: String(q.label || ''), shuffle: q.shuffle === true };
}

/* =========================================================
   목록 거르기
   ========================================================= */
function isNew(p) {
  if (!p.added) return false;
  const d = daysBetween(p.added, todayStr());
  return d >= 0 && d < CONFIG.NEW_DAYS;
}

function filterBy(age) {
  return state.songs.filter(p => p.ages.includes(age) && (!state.cat || p.cats.includes(state.cat)));
}

function allCats() {
  const set = new Set();
  state.songs.forEach(p => p.cats.forEach(c => set.add(c)));
  return CAT_ORDER.filter(c => set.has(c)).concat([...set].filter(c => !CAT_ORDER.includes(c)));
}

function newInfo() {
  const news = state.songs.filter(isNew);
  const latest = news.reduce((m, p) => (p.added > m ? p.added : m), '');
  return { count: news.length, latest, show: news.length > 0 && latest > state.seenNew };
}

function filterLabel() {
  return state.age + (state.cat ? ' ' + state.cat : '') + ' 동요';
}

function songRowHTML(p, i, opts) {
  opts = opts || {};
  const n = (i || 0) % 4;
  const pickIdx = state.selecting && opts.selectable ? state.picks.indexOf(p.id) : -1;
  const attr = opts.selectable && state.selecting ? `data-pickid="${esc(p.id)}" aria-pressed="${pickIdx >= 0}"`
    : opts.playAttr || `data-play="${esc(p.id)}"`;
  const right = opts.selectable && state.selecting
    ? `<span class="check" aria-hidden="true">${pickIdx >= 0 ? ICON.check : ''}</span>`
    : opts.right != null ? opts.right : `<span class="sicon" aria-hidden="true">${ICON.playSm}</span>`;
  return `
    <button type="button" class="song${pickIdx >= 0 ? ' picked' : ''}${opts.now ? ' now' : ''}" ${attr}>
      ${pickIdx >= 0 ? `<span class="order" aria-hidden="true">${pickIdx + 1}</span>` : ''}
      <span class="thumbwrap c${n}">
        <span class="thumbph">${ICON.playPh}</span>
        <img class="thumb" src="https://img.youtube.com/vi/${esc(p.id)}/mqdefault.jpg" alt="" loading="lazy" data-thumb>
        ${isNew(p) ? '<span class="badge">NEW</span>' : ''}
        <span class="ytmark">YouTube</span>
      </span>
      <span class="sbody">
        <span class="stitle">${esc(p.title)}</span>
        <span class="smeta">${esc(metaText(p))}</span>
      </span>
      ${right}
    </button>`;
}

  const showHomeTip = !state.homeTipClosed && !isStandalone();

    body = `<section class="sec">${emptyHTML(state.loadError
      ? '노래 목록을 불러오지 못했어요.<br>잠시 뒤에 다시 열어주세요.'
      : '노래 목록을 불러오는 중이에요.')}</section>`;

    body = listsHTML();

    let rows = list.length

      const extra = [];
      others.forEach(a => filterBy(a).forEach(p => { if (!seen.has(p.id)) { seen.add(p.id); extra.push(p); } }));

function startQueue(ids, startId, label, shuffle) {
  ids = ids.filter(id => songOf(id));
  if (!ids.length) return;
  const base = ids.slice();
  let order = base.slice();
  let start = startId && base.includes(startId) ? startId : base[0];
  if (shuffle) {
    if (startId) order = [start].concat(shuffled(base.filter(x => x !== start)));
    else { order = shuffled(base); start = order[0]; }
  }
  state.queue = { ids: order, base, idx: order.indexOf(start), label: label || '', shuffle: !!shuffle };
  save();
  closeLayer();
  cameFromHome = true;
  if (location.hash === '#play/' + start) route();
  else location.hash = 'play/' + start;
}

function currentId() {
  const q = state.queue;
  return q && q.ids[q.idx] ? q.ids[q.idx] : null;
}

function setShuffle(on) {
  const q = state.queue;
  if (!q) return;
  const cur = currentId();
  if (on) q.ids = [cur].concat(shuffled(q.base.filter(x => x !== cur)));
  else q.ids = q.base.slice();
  q.idx = Math.max(0, q.ids.indexOf(cur));
  q.shuffle = on;
  save();
  updateNowPlaying();
}

function pressKey(k) {
  const q = state.quiz;
  if (!q) return;
  const ans = String(q.a * q.b);
  if (k === 'del') { q.input = q.input.slice(0, -1); openUnlock(); return; }
  if (q.input.length >= ans.length) return;
  q.input += k;
  if (q.input.length < ans.length) { openUnlock(); return; }
  if (q.input === ans) {
    kidOff();
    closeLayer();
  } else {
    newQuiz();
    openUnlock('다시 해볼까요? 문제가 바뀌었어요.');
  }
}

function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytApiPromise;
}

function updateNowPlaying() {
  const q = state.queue;
  const p = songOf(currentId());
  if (!q || !p) return;
  document.querySelectorAll('[data-now-title]').forEach(el => { el.textContent = p.title; });
  document.querySelectorAll('[data-now-meta]').forEach(el => { el.textContent = metaText(p); });
  document.querySelectorAll('[data-now-src]').forEach(el => { el.textContent = '영상 출처: ' + (p.channel || 'YouTube') + ' · YouTube'; });
  const qtext = (q.label ? q.label + ' · ' : '') + (q.idx + 1) + ' / ' + q.ids.length + '곡' + (q.shuffle ? ' · 섞어 듣기' : '');
  document.querySelectorAll('[data-now-q]').forEach(el => { el.textContent = qtext; });
  document.querySelectorAll('[data-fav]').forEach(b => {
    if (b.classList.contains('favbtn')) {
      const on = inAnyList(p.id);
      b.innerHTML = on ? ICON.heartFill : ICON.heart;
      b.setAttribute('aria-pressed', on);
    }
  });
  document.querySelectorAll('[data-prev]').forEach(b => { b.disabled = q.idx <= 0; });
  document.querySelectorAll('[data-next]').forEach(b => { b.disabled = q.idx >= q.ids.length - 1; });
  document.querySelectorAll('[data-shuffle]').forEach(b => b.setAttribute('aria-pressed', q.shuffle));
  document.querySelectorAll('[data-repeat]').forEach(b => b.setAttribute('aria-pressed', state.repeatOne));
  const up = document.querySelector('[data-upnext]');
  if (up) {
    const rest = q.ids.slice(q.idx + 1).map(songOf).filter(Boolean);
    up.innerHTML = rest.length
      ? rest.slice(0, 30).map((s, i) => songRowHTML(s, i, { playAttr: `data-jump="${q.idx + 1 + i}"` })).join('')
      : emptyHTML('이 노래가 목록의 마지막 곡이에요.', 'chick');
  }
  const want = '#play/' + p.id;
  if (location.hash !== want) {
    try { history.replaceState(null, '', want); } catch (e) {}
  }
}

function startPlayer(id) {
  player.reset();
  loadYouTubeAPI().then(() => {
    if (!document.getElementById('yt')) return;
    player.yt = new YT.Player('yt', {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, autoplay: 1 },
      events: {
        onReady: () => { player.ready = true; },
        onStateChange: e => {
          player.playing = e.data === YT.PlayerState.PLAYING;
          updateToggle();
          if (e.data === YT.PlayerState.ENDED) onEnded();
        },
        onError: () => onVideoError()
      }
    });
  });
}

function goTo(idx, autoplay) {
  const q = state.queue;
  if (!q || idx < 0 || idx >= q.ids.length) return;
  if (player.skipTimer) { clearTimeout(player.skipTimer); player.skipTimer = null; }
  q.idx = idx;
  save();
  const id = currentId();
  const box = document.querySelector('.video');
  if (box && !document.getElementById('yt') && !player.yt) {
    box.innerHTML = '<div id="yt"></div>';
  }
  updateNowPlaying();
  if (player.yt && player.ready && player.yt.loadVideoById) {
    const err = document.querySelector('.video .err');
    if (err) err.remove();
    player.yt.loadVideoById(id);
    if (!autoplay) { try { player.yt.playVideo(); } catch (e) {} }
  } else {
    startPlayer(id);
  }
}

function onEnded() {
  const q = state.queue;
  if (!q) return;
  if (state.repeatOne) { player.yt.seekTo(0, true); player.yt.playVideo(); return; }
  if (q.idx < q.ids.length - 1) goTo(q.idx + 1, true);
}

function onVideoError() {
  const q = state.queue;
  const p = songOf(currentId());
  const box = document.querySelector('.video');
  if (!box || !p) return;
  const old = box.querySelector('.err');
  if (old) old.remove();
  const hasNext = q && q.idx < q.ids.length - 1;
  const div = document.createElement('div');
  div.className = 'err';
  div.innerHTML = `이 영상은 앱 안에서 재생할 수 없어요.${hasNext ? '<br>잠시 뒤 다음 곡으로 넘어가요.' : ''}
    <a href="https://www.youtube.com/watch?v=${esc(p.id)}" target="_blank" rel="noopener" class="nk">유튜브에서 보기</a>`;
  box.appendChild(div);
  if (hasNext) player.skipTimer = setTimeout(() => goTo(q.idx + 1, true), 2500);
}

function updateToggle() {
  document.querySelectorAll('[data-toggle-ic]').forEach(el => { el.innerHTML = player.playing ? ICON.pause : ICON.play; });
  document.querySelectorAll('[data-toggle-label]').forEach(el => { el.textContent = player.playing ? '일시정지' : '재생'; });
}

function enterBig() {
  document.body.classList.add('big');
  const wrap = document.getElementById('playwrap');
  try {
    if (wrap && wrap.requestFullscreen) {
      wrap.requestFullscreen().then(() => {
        try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      }).catch(() => {});
    }
  } catch (e) {}
}

function exitBig() {
  if (!document.body.classList.contains('big')) return;
  document.body.classList.remove('big');
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  try { screen.orientation.unlock(); } catch (e) {}
}

  if (!document.fullscreenElement && !state.kid) exitBig();
});

/* =========================================================
   화면 전환
   ========================================================= */
function route() {
  if (state.kid) {
    const cur = currentId();
    if (cur && songOf(cur)) {
      if (location.hash !== '#play/' + cur) { location.replace('#play/' + cur); return; }
    } else {
      kidOff();
    }
  }
  if (!layerEl.querySelector('[data-kidlayer]')) closeLayer();

  const h = location.hash;
  if (h === '#info') { player.reset(); renderInfo(); return; }
  if (h === '#guide-home') { player.reset(); renderGuideHome(); return; }
  if (h === '#guide-lock') { player.reset(); renderGuideLock(); return; }
  const lm = h.match(/^#list\/([A-Za-z0-9]+)$/);
  if (lm) {
    const l = listOf(lm[1]);
    player.reset();
    document.body.classList.remove('kid');
    if (l) { renderListPage(l); return; }
    location.replace('#'); return;
  }
  const m = h.match(/^#play\/([A-Za-z0-9_-]{11})$/);
  if (m && songOf(m[1])) {
    // 링크로 바로 들어온 경우: 그 노래만 담긴 목록을 만들어요
    if (!state.queue || !state.queue.ids.includes(m[1])) {
      state.queue = { ids: [m[1]], base: [m[1]], idx: 0, label: '', shuffle: false };
    } else {
      state.queue.idx = state.queue.ids.indexOf(m[1]);
    }
    save();
    renderPlayer();
    return;
  }
  player.reset();
  document.body.classList.remove('kid');
  renderHome();
}

window.addEventListener('hashchange', route);

/* =========================================================
   이름 입력 (목록 만들기·바꾸기)
   ========================================================= */
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f || !f.matches) return;
  e.preventDefault();
  if (state.kid) return;
  if (f.matches('[data-newform]')) {
    const name = (f.elements.newname.value || '').trim();
    if (!name) { openAddSheet(state.pending ? state.pending.ids : [], '목록 이름을 적어주세요.'); return; }
    const ids = state.pending ? state.pending.ids : [];
    const l = createList(name, ids);
    if (!l) return;
    afterAdded(l, ids.length);
    return;
  }
  if (f.matches('[data-nameform]')) {
    const name = (f.elements.listname.value || '').trim();
    const msg = layerEl.querySelector('.msg');
    if (!name) { if (msg) msg.textContent = '목록 이름을 적어주세요.'; return; }
    const rid = state.pending && state.pending.rename;
    if (rid) {
      const l = listOf(rid);
      if (l) { l.name = name.slice(0, CONFIG.LIST_NAME_MAX); save(); }
      closeLayer();
      route();
    } else {
      const l = createList(name, []);
      closeLayer();
      if (l) location.hash = 'list/' + l.id;
    }
  }
});

function afterAdded(l, n) {
  if (state.selecting) { state.selecting = false; state.picks = []; }
  closeLayer();
  if (/^#play\//.test(location.hash)) { updateNowPlaying(); return; }
  state.view = 'lists';
  save();
  renderHome();
  window.scrollTo(0, 0);
}

/* =========================================================
   버튼 동작
   ========================================================= */
document.addEventListener('click', e => {
  const sub = e.target.closest('a[data-sub]');
  if (sub) {
    if (state.kid) { e.preventDefault(); return; }
    returnHash = location.hash;
    closeLayer();
    return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm && !state.kid) {
    const l = listOf(rm.dataset.list);
    if (l) { l.ids = l.ids.filter(x => x !== rm.dataset.rm); save(); renderListPage(l); }
    return;
  }

  const t = e.target.closest('button, [data-layer]');
  if (!t) return;
  const d = t.dataset;

  if ('layer' in d) { if (e.target === t) closeLayer(); return; }
  if ('closeLayer' in d) { closeLayer(); return; }
  if (d.key) { pressKey(d.key); return; }
  if ('unlock' in d) { state.quiz = null; newQuiz(); openUnlock(); return; }
  if (state.kid && !('toggle' in d)) return;

  if ('repick' in d || 'pick' in d) { openPick(); return; }
  if (d.go) { startQueue(filterBy(state.age).map(p => p.id), d.go, filterLabel(), false); return; }

  if ('lock' in d) { openLockSheet(); return; }
  if ('lockOn' in d) { kidOn(); closeLayer(); return; }

  if (d.age) { state.age = d.age; state.picks = []; save(); renderHome(); return; }
  if (d.view) { state.view = d.view; state.selecting = false; state.picks = []; save(); renderHome(); return; }
  if (d.cat != null) { state.cat = d.cat; save(); renderHome(); return; }
  if ('seenNew' in d) { state.seenNew = newInfo().latest; save(); renderHome(); return; }
  if ('closeHometip' in d) { state.homeTipClosed = true; save(); renderHome(); return; }
  if ('install' in d) {
    if (installPrompt) {
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; route(); });
    }
    return;
  }

  // 홈: 이어서 듣기 · 섞어 듣기 · 골라 듣기
  if ('playall' in d) { startQueue(filterBy(state.age).map(p => p.id), null, filterLabel(), false); return; }
  if ('shuffleall' in d) { startQueue(filterBy(state.age).map(p => p.id), null, filterLabel(), true); return; }
  if ('selmode' in d) { state.selecting = !state.selecting; state.picks = []; renderHome(); return; }
  if (d.pickid) {
    const i = state.picks.indexOf(d.pickid);
    if (i >= 0) state.picks.splice(i, 1); else state.picks.push(d.pickid);
    const y = window.scrollY;
    renderHome();
    window.scrollTo(0, y);
    return;
  }
  if ('picksclear' in d) { state.picks = []; const y = window.scrollY; renderHome(); window.scrollTo(0, y); return; }
  if ('pickplay' in d || 'pickshuffle' in d) {
    const ids = state.picks.slice();
    state.selecting = false; state.picks = [];
    startQueue(ids, null, '고른 노래', 'pickshuffle' in d);
    return;
  }
  if ('picksave' in d) { openAddSheet(state.picks.slice()); return; }

  // 노래 한 곡 누르기: 지금 보고 있는 목록을 이어서 들어요
  if (d.play) {
    if (layerEl.contains(t)) closeLayer();
    const inExtra = !filterBy(state.age).some(p => p.id === d.play);
    const ids = inExtra ? [d.play] : filterBy(state.age).map(p => p.id);
    startQueue(ids, d.play, inExtra ? '' : filterLabel(), false);
    return;
  }

  // 내 목록
  if ('newlist' in d) { openNameSheet(null); return; }
  if (d.listplay || d.listshuffle) {
    const l = listOf(d.listplay || d.listshuffle);
    if (l) startQueue(l.ids, null, l.name, !!d.listshuffle);
    return;
  }
  if (d.listsong) {
    const l = listOf(d.list);
    if (l) startQueue(l.ids, d.listsong, l.name, false);
    return;
  }
  if ('listback' in d) { state.view = 'lists'; save(); location.hash = ''; return; }
  if (d.rename) { openNameSheet(d.rename); return; }
  if (d.dellist) { openDeleteSheet(d.dellist); return; }
  if (d.dellistok) {
    state.lists = state.lists.filter(l => l.id !== d.dellistok);
    state.view = 'lists';
    save(); closeLayer(); location.hash = '';
    return;
  }
  if (d.addto) {
    const l = listOf(d.addto);
    const ids = state.pending ? state.pending.ids : [];
    if (!l || !ids.length) return;
    if (ids.length === 1 && l.ids.includes(ids[0])) {
      l.ids = l.ids.filter(x => x !== ids[0]);
      save();
      openAddSheet(ids, '"' + l.name + '"에서 뺐어요.');
      updateNowPlaying();
      return;
    }
    ids.forEach(id => { if (!l.ids.includes(id)) l.ids.push(id); });
    save();
    if (ids.length === 1) { openAddSheet(ids, '"' + l.name + '"에 담았어요.'); updateNowPlaying(); }
    else afterAdded(l, ids.length);
    return;
  }

  if ('back' in d) {
    if (cameFromHome) { cameFromHome = false; history.back(); }
    else location.hash = '';
    return;
  }
  if ('subback' in d) {
    const to = returnHash; returnHash = '';
    location.hash = to && to !== location.hash ? to.replace(/^#/, '') : '';
    return;
  }

  // 노래 듣기 화면
  if ('fav' in d) { const id = currentId(); if (id) openAddSheet([id]); return; }
  if (d.jump) { goTo(Number(d.jump), true); window.scrollTo(0, 0); return; }
  if ('repeat' in d) { state.repeatOne = !state.repeatOne; save(); updateNowPlaying(); return; }
  if ('shuffle' in d) { setShuffle(!(state.queue && state.queue.shuffle)); return; }
  if ('prev' in d) { if (state.queue) goTo(state.queue.idx - 1, true); return; }
  if ('next' in d) { if (state.queue) goTo(state.queue.idx + 1, true); return; }
  if ('big' in d) { enterBig(); return; }
  if ('unbig' in d) { exitBig(); return; }

  const yt = player.yt;
  if (!yt || !yt.getPlayerState) return;
  if ('toggle' in d) {
    yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo();
  }
});

/* =========================================================
   시작
   ========================================================= */
async function fetchCSV(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return parseCSV(await res.text());
}

async function init() {
  renderHome();
  const tasks = [];
  if (CONFIG.SHEET_CSV_URL) {
    tasks.push(fetchCSV(CONFIG.SHEET_CSV_URL).then(rows => {
      const list = toSongs(rows);
      if (!list.length) throw new Error('empty');
      state.songs = list;
    }).catch(() => {
      state.loadError = true;
      state.songs = toSongs(parseCSV(SAMPLE_CSV));
    }));
  } else {
    state.songs = toSongs(parseCSV(SAMPLE_CSV));
  }
  if (CONFIG.ITEMS_CSV_URL) {
    tasks.push(fetchCSV(CONFIG.ITEMS_CSV_URL).then(rows => { state.items = toItems(rows); }).catch(() => {}));
  }
  await Promise.all(tasks);
  route();
}

init();
</script>
